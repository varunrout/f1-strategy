[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-strategy"
version = "0.2.0"
description = "F1 tyre degradation analytics pipeline using FastF1, Parquet, DuckDB, and XGBoost"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastf1>=3.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyarrow>=14.0.0",
    "duckdb>=0.9.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "xgboost>=1.7.0",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "statsmodels>=0.14.0",
    "shap>=0.42.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools]
packages = ["src", "src.ingest", "src.features", "src.models", "src.utils"]
