[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-strategy"
version = "0.1.0"
description = "F1 data ingestion and feature engineering pipeline using FastF1 and SQLite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastf1>=3.0.0",
    "pandas>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools]
packages = ["src"]
